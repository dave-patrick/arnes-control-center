<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="publisher" content="Atomic 22 Industries"><title>Codex · arnés</title><link rel="stylesheet" href="style.css"><style>body{height:100dvh;display:flex;margin:0;background:#181b20}.sidebar{width:240px;flex:none;border-right:1px solid #343b47;padding:20px;overflow:auto}.sidebar h2{font-size:20px}.sidebar button{width:100%;margin:5px 0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px}.chat-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.chat-top h2{margin:0}#messages{overflow:auto;flex:1;padding:24px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid #458fea;padding:12px 18px;margin:15px 0;background:#232831;border-radius:0 8px 8px 0;line-height:1.6}.message.user{border-color:#72869d;background:#1f242c}.message.small{font-size:12px;color:#9aa9ba}#compose{display:flex;gap:10px;margin-top:14px}textarea{flex:1;resize:vertical;min-height:65px;max-height:200px;border:1px solid #3c4757;border-radius:9px;background:#222831;color:#e1e7f0;padding:14px;font:inherit}#approvals{max-height:220px;overflow:auto}.approval{border:1px solid #476a91;padding:14px;border-radius:9px;margin:10px 0}.approval pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.approval button{margin-right:8px}#project{max-width:420px;font-size:12px}.empty{max-width:540px;margin:40px auto;color:#8fa0b5;line-height:1.8}.empty h2{color:#e6edf7}#status{font-size:12px;color:#8fa0b5}#error{white-space:pre-wrap}@media(max-width:650px){.sidebar{width:150px;padding:12px}.chat{padding:14px}.chat-top{flex-wrap:wrap}#project{width:100%}}</style></head><body><aside class="sidebar"><span class="eyebrow">LOCAL CODEX</span><h2>Your chats</h2><button id="new">＋ New chat</button><button id="refresh">↻ Refresh</button><div id="threads"></div></aside><section class="chat"><div class="chat-top"><h2>Codex</h2><span id="status">Connecting…</span><button id="stop" disabled>Stop</button></div><label for="project">Project folder for new chats</label><input id="project" placeholder="C:\path\to\project"><p id="error" role="alert"></p><div id="messages"><div class="empty"><h2>Codex, in your workspace.</h2><p>Choose an existing chat or start a new one. Messages run through your locally installed Codex using its current sign-in. This interface keeps tool approvals visible.</p></div></div><div id="approvals"></div><form id="compose"><textarea id="prompt" aria-label="Message Codex" placeholder="Ask Codex to work on something…" required></textarea><button id="send" class="primary">Send</button></form></section><script src="codex.js"></script></body></html>
