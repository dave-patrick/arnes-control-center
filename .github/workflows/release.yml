name: Package source release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: arnes-source
          path: artifacts/*
      - name: Attach tagged source release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/arnes-source.zip artifacts/SHA256SUMS.txt --prerelease --title "arnés ${{ github.ref_name }}" --notes "Clean source package. Requires Node.js 22 and separately configured services. See README and documentation/HELP.md. No credentials or local service installations are included."

